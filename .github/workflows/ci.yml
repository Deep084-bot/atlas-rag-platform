name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit, integration, and migration tests
        run: npm test
        env:
          ATLAS_BACKFILL_INTEGRATION_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_integration_test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

      - name: Build Docker images
        run: docker compose build
