x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  backend:
    build:
      context: .
      target: backend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@postgres:5432/${POSTGRES_DB:-atlas}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-70b-versatile}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-512}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      HF_API_KEY: ${HF_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-huggingface}
      GENERATION_TOP_K: ${GENERATION_TOP_K:-6}
      GENERATION_SIMILARITY_THRESHOLD: ${GENERATION_SIMILARITY_THRESHOLD:-0.5}
      MAX_OCR_FILE_SIZE_MB: ${MAX_OCR_FILE_SIZE_MB:-15}
      DATABASE_SSL: false
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-groq}
    volumes:
      - uploads:/app/uploads
    expose:
      - 8787

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    <<: *restart
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

  pgadmin:
    image: dpage/pgadmin4
    profiles:
      - tools
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@atlas.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"

volumes:
  postgres_data:
  pgadmin_data:
  uploads:
